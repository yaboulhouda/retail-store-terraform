name: "Terraform deploy"
on:
    pull_request:
        branches: [main]
        paths: ["*.tf"]
    push:
        branches: [main]
        paths: ["*.tf"]
    workflow_dispatch:
        inputs:
            environment: { type: environment }
permissions:
    id-token: write
    contents: read
    pull-requests: write
jobs:
    init:
        runs-on: ubuntu-latest
        steps:
            - id: set-env
              run: |
                  if [ "${{ github.event_name }}" == "pull_request" ] || [ "${{ github.event_name }}" == "push" ]; then
                  echo "environment=dev" >> "$GITHUB_OUTPUT"
                  else
                  echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
                  fi
        outputs:
            environment: ${{ steps.set-env.outputs.environment }}
    plan:
        needs: init
        runs-on: ubuntu-latest
        environment: ${{ needs.init.outputs.environment}}
        steps:
            - uses: actions/checkout@v6
            - uses: aws-actions/configure-aws-credentials@v6.2.4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ secrets.AWS_REGION_ID }}
            - uses: hashicorp/setup-terraform@v4
              with:
                  terraform_version: "1.14.6"
            - run: terraform fmt -check
              continue-on-error: true
            - run: terraform init -backend-config=environments/${{ needs.init.outputs.environment}}/backend.hcl
            - run: terraform validate
            - run: terraform plan -out=tfplan -no-color -var-file=environments/${{ needs.init.outputs.environment}}/variables.tfvars
            - uses: actions/upload-artifact@v4
              with:
                  name: tfplan
                  path: tfplan
                  retention-days: 5
    apply:
        runs-on: ubuntu-latest
        needs: [init, plan]
        environment: ${{ needs.init.outputs.environment}}
        if: github.event_name != 'pull_request'
        steps:
            - uses: actions/checkout@v6
            - uses: aws-actions/configure-aws-credentials@v6.2.4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ secrets.AWS_REGION_ID }}
            - uses: hashicorp/setup-terraform@v4
              with:
                  terraform_version: "1.14.6"
            - run: terraform init -backend-config=environments/${{ needs.init.outputs.environment}}/backend.hcl
            - uses: actions/download-artifact@v4
              with:
                  name: tfplan
            - run: terraform apply -auto-approve tfplan
