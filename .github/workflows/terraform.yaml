name: "Terraform deploy"
on:
    workflow_dispatch:
permissions:
    id-token: write
    contents: read
    pull-requests: write
jobs:
    plan:
        runs-on: ubuntu-latest
        steps:
            - name: Git clone the repository
              uses: actions/checkout@v6
            - name: Step Terraform
              uses: hashicorp/setup-terraform@v4
              with:
                  terraform_version: "1.14.6"
            - name: Terraform fmt
              id: fmt
              run: terraform fmt -check
              continue-on-error: true
