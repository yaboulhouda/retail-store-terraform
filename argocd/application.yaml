apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: retail-store
    namespace: argocd
spec:
    project: default
    source:
        repoURL: https://github.com/yaboulhouda/retail-store-chart.git
        targetRevision: main
        path: .
    destination:
        server: https://kubernetes.default.svc
        namespace: default
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
